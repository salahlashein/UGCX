# Render Blueprint for the ReelPal API (free plan). See apps/api/DEPLOY.md.
services:
  - type: web
    name: reelpal-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: launch-v1
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://reelpal.vercel.app
      - key: PLATFORM_FEE_RATE
        value: "0.10"
      - key: CAMPAIGN_DEFAULT_OPEN_DAYS
        value: "14"
      - key: REPORTING_TIME_ZONE
        value: Africa/Cairo
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      # Cloudflare R2 bucket for uploads. These three values are not secret.
      - key: R2_ACCOUNT_ID
        value: cb9affdf1f83e5cc7adedf6330257397
      - key: R2_BUCKET_NAME
        value: reelpal-deliverables
      - key: R2_PUBLIC_BASE_URL
        value: https://pub-45705041a89d434ca03843b65f60d440.r2.dev
      # Secrets: Render asks for these values when you create the Blueprint.
      - key: DATABASE_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
