<title>UGCX Layout Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky picker (screen + layout A/B/C) above one browser-frame preview of the app in the Ledger Mono finish. */
:root {
  --bg: #e8ece7; --panel: #ffffff; --fg: #17241c; --muted: #5d6b62; --line: #d4dbd5;
  --accent: #2f5d46; --accent-soft: #e1ebe4; --on-accent: #ffffff;
  --f-chrome: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #101812; --panel: #17241c; --fg: #e8efe9; --muted: #9fb0a5; --line: #2a3b30; --accent: #a8d8c4; --accent-soft: #1f3027; --on-accent: #0a2e0e; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #101812; --panel: #17241c; --fg: #e8efe9; --muted: #9fb0a5; --line: #2a3b30; --accent: #a8d8c4; --accent-soft: #1f3027; --on-accent: #0a2e0e; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-chrome); font-size: 14px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
* { box-sizing: border-box; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }
.bar-in { max-width: 1360px; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-weight: 500; font-size: 16px; }
.brand span { color: var(--muted); font-size: 13px; }
.ctrls { display: flex; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg .k { font-family: var(--f-mono); margin-inline-end: 6px; opacity: .8; }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap-in { max-width: 1360px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.info { display: flex; gap: 12px 32px; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; }
.info-l { flex: 1 1 360px; min-width: 0; }
.info h2 { margin: 0 0 4px; font-weight: 500; font-size: 20px; text-wrap: balance; }
.info p { margin: 0; color: var(--muted); max-width: 66ch; line-height: 1.5; }
.info ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 360px; justify-content: flex-end; }
.info li { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; }
.frame { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); box-shadow: 0 20px 50px -24px rgba(0,0,0,.35); }
.frame-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.dots { display: flex; gap: 6px; } .dots i { width: 10px; height: 10px; border-radius: 999px; background: var(--line); display: block; }
.url { flex: 1; min-width: 0; background: var(--bg); border-radius: 6px; padding: 4px 10px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-mono); }
.hint { color: var(--muted); font-size: 12px; }

/* ---------- App (Ledger Mono finish, light product look) ---------- */
.app {
  --canvas: #eff2ed; --surface: #ffffff; --soft: #f6f8f5; --strong: #e1e7e2; --dark: #17241c; --dark2: #1f3027;
  --hair: #dde3de; --ink: #17241c; --body: #2c3a31; --muted: #5d6b62; --bstrong: #93a097;
  --primary: #2f5d46; --primary2: #244a37; --accent: #e1ebe4; --white: #ffffff;
  --coral: #aa2d00; --forest: #0a2e0e; --cream: #f5e9d4; --peach: #fcab79; --mint: #a8d8c4; --yellow: #f4d35e; --mustard: #d9a441;
  --danger: #b3261e; --danger-s: #fdecea; --success: #006400; --dash: 1px dashed #b9c4bc;
  --f-ui: 'Inter', -apple-system, 'Segoe UI', sans-serif; --f-num: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', monospace;
  --r: 14px; --r-hero: 16px; --sh: 0 1px 3px rgba(23,36,28,.06);
  --paper: linear-gradient(rgba(168,216,196,.07) 1px, transparent 1px) 0 0/22px 22px, linear-gradient(90deg, rgba(168,216,196,.07) 1px, transparent 1px) 0 0/22px 22px, var(--dark);
  font-family: var(--f-ui); font-size: 15px; line-height: 1.45; color: var(--ink); background: var(--canvas);
  display: flex; container-type: inline-size; min-height: 820px; text-align: start;
}
.app * { box-sizing: border-box; }
.app svg { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.app h1, .app h2, .app h3, .app p { margin: 0; }
.num, .mono { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.ok-t { color: var(--success); }
.overline { font-family: var(--f-num); font-size: 11px; line-height: 14px; letter-spacing: .8px; font-weight: 500; text-transform: uppercase; color: var(--muted); }
.h1 { font-size: 28px; font-weight: 400; line-height: 1.2; text-wrap: balance; }
.h2 { font-size: 18px; font-weight: 500; line-height: 1.3; }
.label { font-size: 15px; font-weight: 500; }

.side { width: 248px; flex: none; background: var(--surface); border-inline-end: 1px solid var(--hair); padding: 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; }
.side-top { display: flex; flex-direction: column; gap: 24px; }
.logo { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo-l { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--primary); color: var(--white); display: grid; place-items: center; font-weight: 500; }
.logo-name { font-size: 17px; font-weight: 500; line-height: 1.2; }
.logo-role { font-family: var(--f-num); font-size: 10.5px; letter-spacing: .8px; color: var(--muted); }
.loc { background: var(--accent); color: var(--primary); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; font-weight: 500; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; color: var(--body); font-size: 15px; font-weight: 500; text-decoration: none; }
.nav a svg { font-size: 18px; color: var(--muted); }
.nav a.on { background: var(--accent); color: var(--primary); } .nav a.on svg { color: var(--primary); }
.nav a .cnt { margin-inline-start: auto; font-family: var(--f-num); font-size: 11px; background: var(--coral); color: var(--white); border-radius: 4px; padding: 1px 6px; }
.side-foot { display: flex; flex-direction: column; gap: 2px; padding-top: 14px; border-top: var(--dash); }
.side-foot a { display: flex; align-items: center; gap: 12px; padding: 8px 14px; color: var(--body); font-size: 13px; text-decoration: none; }
.side-foot a svg { font-size: 17px; color: var(--muted); }
.side-foot a.out, .side-foot a.out svg { color: var(--danger); }

.main { flex: 1; min-width: 0; padding: 24px 28px 56px; }
.sheet { max-width: 1140px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
.tabbar { display: none; }

.card { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); box-shadow: var(--sh); min-width: 0; }
.pad { padding: 18px 20px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: var(--dash); }
.hero { background: var(--paper); border-radius: var(--r-hero); color: var(--white); padding: 24px; position: relative; overflow: hidden; min-width: 0; }
.hero .overline { color: var(--mint); }
.metric { font-family: var(--f-num); font-size: 38px; letter-spacing: -2px; font-weight: 500; line-height: 1.15; font-variant-numeric: tabular-nums; }
.metric.md { font-size: 28px; letter-spacing: -1.2px; }
.metric.sm { font-size: 22px; letter-spacing: -.8px; }

.hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hdr-l { display: flex; align-items: center; gap: 12px; min-width: 0; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.avatar-sq { width: 46px; height: 46px; border-radius: 12px; background: var(--accent); color: var(--primary); display: grid; place-items: center; font-size: 16px; font-weight: 500; flex: none; }
.iconbtn { position: relative; width: 42px; height: 42px; border-radius: 999px; background: var(--surface); border: 1px solid var(--hair); display: grid; place-items: center; color: var(--ink); font-size: 19px; flex: none; }
.iconbtn .dot { position: absolute; top: -4px; inset-inline-end: -4px; min-width: 19px; height: 19px; border-radius: 999px; background: var(--coral); color: var(--white); font: 500 10.5px var(--f-num); display: grid; place-items: center; padding-inline: 4px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 7px 15px; border-radius: 10px; font: 500 14.5px/20px var(--f-ui); border: 1px solid transparent; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn svg { font-size: 17px; }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: 13.5px; }
.btn.primary { background: var(--primary); color: var(--white); border-color: var(--primary); }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--bstrong); }
.btn.secondary svg, .btn.ghost svg { color: var(--primary); }
.btn.ghost { background: transparent; color: var(--primary); }
.btn.mint { background: var(--mint); color: var(--forest); border-color: var(--mint); }
.btn.mint svg { color: var(--forest); }
.btn .n { font-family: var(--f-num); font-size: 11px; background: var(--coral); color: var(--white); border-radius: 4px; padding: 0 5px; }
.kbd { font-family: var(--f-num); font-size: 10.5px; color: var(--muted); border: 1px solid var(--hair); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }

.badge { display: inline-flex; align-items: center; white-space: nowrap; padding: 3px 8px; border-radius: 4px; font: 500 10px/14px var(--f-num); letter-spacing: .6px; text-transform: uppercase; }
.b-ok { background: var(--accent); color: var(--primary); }
.b-pend { background: var(--cream); color: var(--ink); }
.b-bad { background: var(--danger-s); color: var(--danger); }
.b-neu { background: var(--strong); color: var(--body); }
.b-info { background: #e3ebfb; color: #254fad; }
.tag { font: 500 9.5px/13px var(--f-num); letter-spacing: .6px; text-transform: uppercase; color: var(--primary); border: 1px dashed var(--primary); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 8px; background: var(--surface); color: var(--body); border: 1px solid var(--hair); font-size: 13px; font-weight: 500; cursor: pointer; }
.chip .c { font-family: var(--f-num); opacity: .7; font-size: 12px; }
.chip.on { background: var(--primary); color: var(--white); border-color: var(--primary); } .chip.on .c { opacity: .9; }

.rows > * + * { border-top: var(--dash); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 20px; min-width: 0; }
.row-l { display: flex; align-items: center; gap: 12px; min-width: 0; }
.row-t { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.row-r { display: flex; align-items: center; gap: 12px; flex: none; }
.dir { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--primary); display: grid; place-items: center; font-size: 17px; flex: none; }
.dir.out { background: var(--strong); color: var(--body); }
.dir.warn { background: var(--cream); color: var(--ink); }
.dir.bad { background: var(--danger-s); color: var(--danger); }
.ic-tile { width: 36px; height: 36px; border-radius: 9px; border: 1px dashed var(--bstrong); background: var(--soft); color: var(--primary); display: grid; place-items: center; font-size: 17px; flex: none; }
.avatar { width: 40px; height: 40px; border-radius: 999px; background: var(--accent); color: var(--primary); display: grid; place-items: center; font-weight: 500; font-size: 14px; flex: none; }
.avatar.lg { width: 60px; height: 60px; font-size: 20px; }
.av-1 { background: var(--mint); color: var(--forest); } .av-2 { background: var(--cream); color: var(--ink); } .av-3 { background: var(--peach); color: var(--ink); }

.tblw { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; min-width: 680px; }
.tbl th { text-align: start; font: 500 10.5px/14px var(--f-num); letter-spacing: .7px; text-transform: uppercase; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--hair); white-space: nowrap; background: var(--soft); }
.tbl td { padding: 13px 14px; border-bottom: var(--dash); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th:first-child, .tbl td:first-child { padding-inline-start: 20px; }
.tbl th:last-child, .tbl td:last-child { padding-inline-end: 20px; }
.tbl .r { text-align: end; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--soft); }
.tbl tr.exp td { background: var(--soft); }

.meter { display: flex; height: 8px; border-radius: 2px; overflow: hidden; background: var(--strong); }
.meter > i { display: block; height: 100%; }
.m-spent { background: var(--dark); } .m-alloc { background: var(--mustard); } .m-avail { background: var(--primary); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.minibar { width: 120px; height: 6px; background: var(--strong); border-radius: 2px; overflow: hidden; }
.minibar i { display: block; height: 100%; background: var(--primary); }

/* bar chart: heights are value / max */
.chart { display: grid; grid-template-columns: 44px 1fr; gap: 8px; }
.yax { display: flex; flex-direction: column; justify-content: space-between; font: 400 10.5px var(--f-num); color: var(--muted); text-align: end; padding-bottom: 20px; }
.plot { position: relative; display: flex; gap: 10px; align-items: flex-end; height: 160px; padding-bottom: 20px; border-bottom: 1px solid var(--hair); background: repeating-linear-gradient(to top, transparent 0 calc((100% - 20px) / 2 - 1px), rgba(23,36,28,.07) calc((100% - 20px) / 2 - 1px) calc((100% - 20px) / 2)); background-size: 100% calc(100% - 20px); background-repeat: no-repeat; }
.bar { flex: 1; position: relative; height: 100%; display: flex; align-items: flex-end; }
.bar i { display: block; width: 100%; background: var(--bstrong); border-radius: 3px 3px 0 0; }
.bar.cur i { background: var(--primary); }
.bar b { position: absolute; bottom: -19px; inset-inline: 0; text-align: center; font: 400 10.5px var(--f-num); color: var(--muted); }
.bar em { position: absolute; inset-inline: 0; text-align: center; font: 500 10.5px var(--f-num); font-style: normal; color: var(--ink); }
.hero .plot { border-bottom-color: rgba(168,216,196,.25); background-image: none; }
.hero .bar i { background: rgba(168,216,196,.35); } .hero .bar.cur i { background: var(--mint); }
.hero .bar b, .hero .yax { color: rgba(255,255,255,.6); } .hero .bar em { color: var(--white); }

.grid-2-1 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid-1-1 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.cells { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); }
.cells > div { padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cells > div + div { border-inline-start: var(--dash); }
.hero .cells > div + div { border-inline-start: 1px dashed rgba(168,216,196,.3); }
.hero .cells > div { padding: 0 20px; } .hero .cells > div:first-child { padding-inline-start: 0; }
.delta { font: 500 11.5px var(--f-num); color: var(--success); }
.spark { width: 100%; height: 34px; }
.spark path { stroke: var(--primary); stroke-width: 1.6; fill: none; }
.spark path.a { fill: rgba(47,93,70,.1); stroke: none; }

.qa { display: flex; flex-direction: column; }
.qa a { display: flex; align-items: center; gap: 12px; padding: 11px 20px; text-decoration: none; color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer; }
.qa a + a { border-top: var(--dash); }
.qa a:hover { background: var(--soft); }
.qa a .kbd { margin-inline-start: auto; }
.qa a .n { font-family: var(--f-num); font-size: 11px; background: var(--coral); color: var(--white); border-radius: 4px; padding: 0 5px; }

.tl { display: flex; flex-direction: column; padding: 6px 20px 14px; }
.tl > div { display: grid; grid-template-columns: 14px 1fr; gap: 10px; padding-block: 8px; position: relative; }
.tl > div::before { content: ""; position: absolute; inset-inline-start: 6px; top: 24px; bottom: -8px; border-inline-start: var(--dash); }
.tl > div:last-child::before { display: none; }
.tl .pt { width: 13px; height: 13px; border-radius: 999px; border: 2px solid var(--primary); background: var(--surface); margin-top: 3px; }
.tl .pt.warm { border-color: var(--mustard); }

.pipe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.pipe > div { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; position: relative; }
.pipe > div + div { border-inline-start: var(--dash); }
.pipe .cnt { font: 500 30px/1 var(--f-num); letter-spacing: -1px; }
.pipe .item { font-size: 12.5px; padding: 6px 8px; border-radius: 6px; background: var(--soft); border: 1px solid var(--hair); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pipe .item.hot { border-color: var(--coral); }
.pipe .arrow { position: absolute; top: 18px; inset-inline-end: -9px; width: 18px; height: 18px; border-radius: 999px; background: var(--surface); border: 1px solid var(--hair); display: grid; place-items: center; color: var(--muted); font-size: 11px; z-index: 1; }

.tiles2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { padding: 16px; display: flex; flex-direction: column; gap: 14px; cursor: pointer; }
.tile-top { display: flex; justify-content: space-between; align-items: center; }

/* proposals: split */
.split { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; align-items: start; }
.plist { overflow: hidden; }
.pitem { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; cursor: pointer; border-inline-start: 3px solid transparent; }
.pitem:hover { background: var(--soft); }
.pitem.sel { background: var(--soft); border-inline-start-color: var(--primary); }
.pitem .meta { font-size: 12px; color: var(--muted); }
.pitem .pr { text-align: end; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.detail .top { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 22px 24px; border-bottom: var(--dash); }
.who { display: flex; gap: 14px; align-items: center; min-width: 0; }
.who-m { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.who-m svg { font-size: 13px; }
.stat3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: var(--dash); }
.stat3 > div { padding: 14px 24px; display: flex; flex-direction: column; gap: 2px; }
.stat3 > div + div { border-inline-start: var(--dash); }
.dsec { padding: 18px 24px; display: flex; flex-direction: column; gap: 10px; border-bottom: var(--dash); }
.quote { font-size: 15px; line-height: 1.6; color: var(--body); padding-inline-start: 14px; border-inline-start: 2px solid var(--mint); }
.thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.thumbs > div { aspect-ratio: 9/12; max-width: 100%; border-radius: 10px; position: relative; overflow: hidden; display: grid; place-items: center; color: var(--white); font-size: 22px; }
.thumbs > div span { position: absolute; bottom: 8px; inset-inline-end: 8px; font: 500 10.5px var(--f-num); background: rgba(10,46,14,.7); padding: 1px 5px; border-radius: 4px; }
.th1 { background: linear-gradient(160deg, #2f5d46, #0a2e0e); } .th2 { background: linear-gradient(160deg, #d9a441, #aa2d00); } .th3 { background: linear-gradient(160deg, #a8d8c4, #2f5d46); }

const store = {
  get(k, d) { try { return localStorage.getItem('ugcx-ls-' + k) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ugcx-ls-' + k, v); } catch (e) {} }
};
let state = { screen: store.get('screen4', 'hub'), layout: +store.get('layout4', 0) };
if (!SCREENS.some(s => s.id === state.screen)) state.screen = 'hub';
if (![0, 1, 2].includes(state.layout)) state.layout = 0;
const $ = id => document.getElementById(id);
const scrBtn = (s) => `<button type="button" data-screen="${s.id}"><span class="k">${SCREENS.indexOf(s) + 1}</span>${s.name}${s.pick != null ? `<span class="pickmark">${'ABC'[s.pick]}</span>` : ''}</button>`;
$('screens').innerHTML = `<span class="grp-l">Picked</span>${SCREENS.filter(s => s.pick != null).map(scrBtn).join('')}${SCREENS.some(s => s.pick == null) ? '<span class="grp-l">New</span>' + SCREENS.filter(s => s.pick == null).map(scrBtn).join('') : ''}`;
const defLayout = id => SCREENS.find(s => s.id === id).pick ?? 0;

function draw() {
  const s = SCREENS.find(x => x.id === state.screen), L = s.L[state.layout];
  document.querySelectorAll('[data-screen]').forEach(b => b.setAttribute('aria-pressed', b.dataset.screen === state.screen));
  $('layouts').innerHTML = s.L.map((l, i) => `<button type="button" data-layout="${i}" aria-pressed="${i === state.layout}"><span class="k">${'ABC'[i]}</span>${l.name}${s.pick === i ? '<span class="pickmark">Picked</span>' : ''}</button>`).join('');
  $('out').innerHTML = `<div class="info"><div class="info-l"><h2>${s.name} · Layout ${'ABC'[state.layout]}: ${L.name}${s.pick === state.layout ? ' · your pick' : ''}</h2><p>${L.desc}</p></div><ul>${L.pts.map(p => `<li>${p}</li>`).join('')}</ul></div>
    <div class="frame"><div class="frame-bar"><div class="dots"><i></i><i></i><i></i></div><div class="url">${s.url}</div></div>
    <div class="app">${s.role === 'none' ? L.fn() : side(s.role, s.nav) + '<main class="main"><div class="sheet">' + L.fn() + tabbar(s.role, Math.min(s.nav, 4)) + '</div></main>'}</div></div>
    <div class="hint">Press ← and → to change the screen, and A, B or C to change the layout. All names and amounts are example data. Make the window narrow to see the phone layout.</div>`;
}
function set(p) { Object.assign(state, p); store.set('screen4', state.screen); store.set('layout4', state.layout); draw(); }
const ORDER = () => [...SCREENS.filter(s => s.pick != null), ...SCREENS.filter(s => s.pick == null)];
function stepScreen(d) { const o = ORDER(), i = o.findIndex(s => s.id === state.screen), n = o[(i + d + o.length) % o.length]; set({ screen: n.id, layout: n.pick ?? 0 }); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-screen],[data-layout],[data-sel],[data-exp]'); if (!b) return;
  if (b.dataset.screen) set({ screen: b.dataset.screen, layout: defLayout(b.dataset.screen) });
  else if (b.dataset.layout) set({ layout: +b.dataset.layout });
  else if (b.dataset.sel) { selP = +b.dataset.sel; draw(); }
  else if (b.dataset.exp) { expP = expP === +b.dataset.exp ? -1 : +b.dataset.exp; draw(); }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === ']' || k === 'arrowright') stepScreen(1);
  else if (k === '[' || k === 'arrowleft') stepScreen(-1);
  else if (['a', 'b', 'c'].includes(k)) set({ layout: 'abc'.indexOf(k) });
  else if (state.screen === 'proposals' && state.layout === 0 && (k === 'j' || k === 'k')) { selP = (selP + (k === 'j' ? 1 : PROPS.length - 1)) % PROPS.length; draw(); }
});
draw();
</script>
